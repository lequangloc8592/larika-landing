
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larika | Đột Phá Công Nghệ In 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }
        .font-space {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* Hiệu ứng Tuyết rơi Noel */
        @keyframes snowfall {
            0% { transform: translateY(-10vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        @keyframes snow-sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(35px); }
        }

        .snowflake-wrapper {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake-inner {
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Hiệu ứng lơ lửng cho các vật thể 3D */
        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .animate-float {
            animation: floating 6s ease-in-out infinite;
        }

        .text-glow-gold {
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.6), 0 0 40px rgba(245, 158, 11, 0.2);
        }

        /* Tia sáng cực quang mờ */
        @keyframes aurora {
            0%, 100% { opacity: 0.2; filter: hue-rotate(0deg); }
            50% { opacity: 0.5; filter: hue-rotate(30deg); }
        }
        
        .aurora-bg {
            animation: aurora 10s ease-in-out infinite;
        }
    
        /* Dây đèn Noel (twinkle lights) */
        @keyframes twinkle {
            0%, 100% { transform: translateY(0) scale(0.95); filter: brightness(0.8); }
            50% { transform: translateY(-1px) scale(1.1); filter: brightness(1.25); }
        }

        .christmas-light {
            position: absolute;
            top: 6px;
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(255,255,255,0.45);
            animation-name: twinkle;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }
        .christmas-light--amber {
            background: rgba(245, 158, 11, 0.95);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.55);
        }
        .christmas-light--red {
            background: rgba(239, 68, 68, 0.95);
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.55);
        }
        .christmas-light--emerald {
            background: rgba(16, 185, 129, 0.95);
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.55);
        }

</style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
